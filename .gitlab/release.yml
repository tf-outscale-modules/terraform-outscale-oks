validate:opentofu:
  stage: validate
  image: ubuntu:24.04
  cache:
    - key: mise-${CI_COMMIT_REF_SLUG}
      paths:
        - .cache/mise
  variables:
    MISE_DATA_DIR: "${CI_PROJECT_DIR}/.cache/mise"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null 2>&1
    - curl -fsSL https://mise.run | MISE_VERSION=${MISE_VERSION} sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install --yes
    - eval "$(mise activate bash)"
  script:
    - tofu init -backend=false
    - tofu validate
    - tofu fmt -check -recursive

validate:tflint:
  stage: validate
  image: ubuntu:24.04
  cache:
    - key: mise-${CI_COMMIT_REF_SLUG}
      paths:
        - .cache/mise
  variables:
    MISE_DATA_DIR: "${CI_PROJECT_DIR}/.cache/mise"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null 2>&1
    - curl -fsSL https://mise.run | MISE_VERSION=${MISE_VERSION} sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install --yes
    - eval "$(mise activate bash)"
  script:
    - tflint --init
    - tflint --recursive

verify:changelog:
  stage: validate
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    - key: mise-${CI_COMMIT_REF_SLUG}
      paths:
        - .cache/mise
  variables:
    MISE_DATA_DIR: "${CI_PROJECT_DIR}/.cache/mise"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null 2>&1
    - curl -fsSL https://mise.run | MISE_VERSION=${MISE_VERSION} sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install --yes
    - eval "$(mise activate bash)"
  script:
    - git-cliff --latest -u > /tmp/changelog
    - diff -u CHANGELOG.md /tmp/changelog

create:release:
  stage: release
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    - key: mise-${CI_COMMIT_REF_SLUG}
      paths:
        - .cache/mise
  variables:
    MISE_DATA_DIR: "${CI_PROJECT_DIR}/.cache/mise"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null 2>&1
    - curl -fsSL https://mise.run | MISE_VERSION=${MISE_VERSION} sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install --yes
    - eval "$(mise activate bash)"
  script:
    - git-cliff --latest -u > /tmp/changelog
    - |
      curl --request POST \
        --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
        --data-binary @/tmp/changelog \
        --url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}"
  dependencies:
    - validate:opentofu
    - validate:tflint
    - verify:changelog
